name: Build Android APK (قطرة دم - قعطبة)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # يتيح تشغيل البناء يدوياً في أي وقت بضغطة زر واحدة من GitHub

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Export Qatra_Dam.apk
    runs-on: ubuntu-latest

    steps:
      - name: 📥 استنساخ المستودع (Checkout Repository)
        uses: actions/checkout@v4

      - name: ☕ تثبيت بيئة جافا (Set up Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 ضبط بيئة الأندرويد (Set up Android SDK)
        uses: android-actions/setup-android@v3

      - name: 🟢 تثبيت Node.js (Set up Node 20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 تثبيت حزم المشروع (Install Dependencies)
        run: |
          npm install --legacy-peer-deps

      - name: 🏗️ بناء تطبيق الويب وتحديث الأندرويد (Build & Sync)
        run: |
          npm run build
          # تحديث ملفات الويب داخل تطبيق الأندرويد
          npx cap sync android

      - name: ⚙️ بناء ملف الـ APK عبر Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 🏷️ استخراج وتسمية ملف الـ APK باسم Qatra_Dam.apk
        run: |
          mkdir -p build-output
          # نسخ ملف الـ APK الناتج بالاسم المطلوب بدقة
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Qatra_Dam.apk
          echo "تم استخراج ملف الـ APK بنجاح بالاسم المطلوب:"
          ls -lh build-output/

      - name: 🚀 رفع ملف Qatra_Dam.apk ضمن الـ Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Qatra_Dam
          path: build-output/Qatra_Dam.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🌟 نشر ملف Qatra_Dam.apk في GitHub Releases (للتحميل المباشر للهاتف بصيغة APK دون أي ضغط ZIP)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: "v1.0.0"
          name: "تطبيق قطرة دم - قعطبة (Qatra_Dam.apk)"
          body: |
            ### 📱 تطبيق قطرة دم تنقذ حياة إنسان - مديرية قعطبة
            تم بناء ملف التطبيق الحقيقي بنجاح للأندرويد:
            - **اسم الملف:** `Qatra_Dam.apk`
            - **طريقة التثبيت:** اضغط مباشرة على الرابط المرفق أدناه `Qatra_Dam.apk` من هاتفك الأندرويد ليبدأ التحميل والتثبيت الفوري دون الحاجة لفك ضغط.
          draft: false
          prerelease: false
          files: build-output/Qatra_Dam.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
